```properties
# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8080}


# ==========================================
# DATABASE CONFIGURATION
# ==========================================
# Set DB_URL, DB_USERNAME and DB_PASSWORD
# in Render Environment Variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================================
# JWT CONFIGURATION
# ==========================================
toyland.app.jwtSecret=${JWT_SECRET}
toyland.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}


# ==========================================
# RAZORPAY CONFIGURATION
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.shipping.fee=${RAZORPAY_SHIPPING_FEE:50.00}


# ==========================================
# BREVO EMAIL CONFIGURATION
# ==========================================
# HTTPS API is used by EmailService.
# Do NOT put your actual API key in this file.
brevo.api.key=${BREVO_API_KEY}

# Verified Brevo sender email
spring.mail.username=${MAIL_USERNAME}


# ==========================================
# FRONTEND CONFIGURATION
# ==========================================
app.frontend.url=${FRONTEND_URL:https://toy-ecommerce-one.vercel.app}
```
