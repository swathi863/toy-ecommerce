# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${PORT:8080}

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/toyland?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT CONFIGURATION
# ==========================================
toyland.app.jwtSecret=${JWT_SECRET:ToylandSecretKeyForJwtAuthenticationSystemMustBeAtLeast32BytesLong1234567890}
toyland.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# RAZORPAY CONFIGURATION
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TdrNwXVXQOMj7j}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy_test_secret_for_signature}
razorpay.shipping.fee=${RAZORPAY_SHIPPING_FEE:50.00}

# ==========================================
# BREVO EMAIL CONFIGURATION
# ==========================================
brevo.api.key=${BREVO_API_KEY:}
spring.mail.username=${MAIL_USERNAME:desaswathi@gmail.com}

# ==========================================
# FRONTEND CONFIGURATION
# ==========================================
app.frontend.url=${FRONTEND_URL:https://toy-ecommerce-git-main-projects-b51c.vercel.app}
