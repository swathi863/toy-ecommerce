# ==========================================
# SERVER & COMPRESSION CONFIGURATION
# ==========================================
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

# ==========================================
# DATABASE & HIKARICP POOL CONFIGURATION
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/toyland?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Optimization for Aiven Cloud
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=15000

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==========================================
# JWT CONFIGURATION
# ==========================================
toyland.app.jwtSecret=${JWT_SECRET}
toyland.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# RAZORPAY CONFIGURATION
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.shipping.fee=${RAZORPAY_SHIPPING_FEE:50.00}

# ==========================================
# BREVO EMAIL CONFIGURATION
# ==========================================
brevo.api.key=${BREVO_API_KEY}
spring.mail.username=${MAIL_USERNAME}

# ==========================================
# FRONTEND CONFIGURATION
# ==========================================
app.frontend.url=${FRONTEND_URL:https://toy-ecommerce-one.vercel.app}
